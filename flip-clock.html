<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flip Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --card-face: #f0c060;
    --card-face-sec: #c89438;
    --divider: #0d0d0d;
    --accent: #e8a820;
    --dim: #806030;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 997;
  }

  /* Vignette */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 996;
  }

  /* ── Snow canvas ── */
  #snow-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .snowflake {
    position: absolute;
    top: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.82);
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 0.7; }
    100% { transform: translateY(105vh) translateX(var(--drift)); opacity: 0; }
  }

  /* ── Clock ── */
  .clock {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    position: relative;
    z-index: 10;
  }

  .digit-group { display: flex; gap: 5px; }
  .digit-group.seconds { margin-bottom: 4px; }

  .colon {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding-bottom: 8px;
  }
  .colon.sec-colon { gap: 9px; padding-bottom: 6px; }

  .colon-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 18px rgba(232,168,32,0.35);
    animation: blink 1s step-end infinite;
  }
  .sec-colon .colon-dot { width: 6px; height: 6px; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.12; }
  }

  /* ── Flip card ── */
  .flip-card {
    position: relative;
    width: 82px; height: 110px;
    perspective: 380px;
    flex-shrink: 0;
  }
  .flip-card.sm { width: 60px; height: 80px; }

  .static-top, .static-bottom {
    position: absolute;
    left: 0; width: 100%; height: 50%;
    overflow: hidden;
  }
  .static-top {
    top: 0;
    border-radius: 6px 6px 0 0;
    border-bottom: 2px solid var(--divider);
    background: linear-gradient(160deg, #221c10 0%, #1a1510 100%);
  }
  .static-bottom {
    top: 50%;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(160deg, #1a1510 0%, #131008 100%);
    box-shadow: 0 6px 20px rgba(0,0,0,0.8), inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .static-top .digit-face,
  .static-bottom .digit-face {
    position: absolute;
    width: 100%; height: 200%;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; font-weight: 700;
    color: var(--card-face);
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 28px rgba(240,192,96,0.13);
    letter-spacing: -2px;
  }
  .flip-card.sm .static-top .digit-face,
  .flip-card.sm .static-bottom .digit-face {
    font-size: 58px;
    color: var(--card-face-sec);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    letter-spacing: -1px;
  }
  .static-bottom .digit-face { top: -100%; }

  .flap-top, .flap-bottom {
    position: absolute;
    left: 0; width: 100%; height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }
  .flap-top {
    top: 0;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(160deg, #282010 0%, #1e1a0e 100%);
    z-index: 10;
    transform: rotateX(0deg);
    transform-origin: bottom center;
  }
  .flap-bottom {
    top: 50%;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(160deg, #1e1a0e 0%, #151108 100%);
    z-index: 9;
    transform: rotateX(90deg);
    transform-origin: top center;
  }
  .flap-top .digit-face, .flap-bottom .digit-face {
    position: absolute;
    width: 100%; height: 200%;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; font-weight: 700;
    color: var(--card-face);
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 28px rgba(240,192,96,0.12);
    letter-spacing: -2px;
    backface-visibility: hidden;
  }
  .flip-card.sm .flap-top .digit-face,
  .flip-card.sm .flap-bottom .digit-face {
    font-size: 58px;
    color: var(--card-face-sec);
    letter-spacing: -1px;
  }
  .flap-bottom .digit-face { top: -100%; }

  .flap-top.flip    { animation: flipTop    0.22s ease-in  forwards; }
  .flap-bottom.flip { animation: flipBottom 0.22s ease-out 0.18s forwards; }

  @keyframes flipTop {
    0%   { transform: rotateX(0deg);   }
    100% { transform: rotateX(-90deg); box-shadow: 0 8px 20px rgba(0,0,0,0.7); }
  }
  @keyframes flipBottom {
    0%   { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg);  }
  }

  .flip-card::after {
    content: '';
    position: absolute;
    left: 3px; right: 3px;
    top: calc(50% - 1px);
    height: 2px;
    background: var(--divider);
    z-index: 20;
    pointer-events: none;
  }

  /* ── Date ── */
  .date-row {
    margin-top: 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--dim);
    letter-spacing: 4px;
    text-transform: uppercase;
    position: relative; z-index: 10;
  }

  /* ── Weather ── */
  .weather {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 28px;
    border: 1px solid #2a1f08;
    border-radius: 4px;
    background: rgba(20,15,5,0.7);
    min-width: 280px;
    justify-content: center;
    position: relative; z-index: 10;
  }
  .weather-icon { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgba(232,168,32,0.3)); }
  .weather-info { display: flex; flex-direction: column; gap: 4px; }
  .weather-temp { font-size: 34px; font-weight: 700; color: var(--card-face); line-height: 1; text-shadow: 0 0 20px rgba(240,192,96,0.2); }
  .weather-desc { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }
  .weather-city { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #503820; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .weather-loading { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim); letter-spacing: 3px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .weather-error { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #604020; letter-spacing: 2px; text-align: center; line-height: 1.7; }

  /* ── Controls panel ── */
  .controls {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 20;
    transition: opacity 0.4s, transform 0.4s;
  }

  .controls.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }

  /* Location row */
  .loc-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .loc-input {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    background: rgba(30,22,8,0.9);
    border: 1px solid #3a2810;
    border-radius: 4px;
    color: #c89030;
    padding: 7px 12px;
    width: 180px;
    outline: none;
    text-transform: uppercase;
  }
  .loc-input::placeholder { color: #4a3018; }
  .loc-input:focus { border-color: #6a4820; }

  /* Buttons row */
  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    background: rgba(30,22,8,0.9);
    border: 1px solid #3a2810;
    border-radius: 4px;
    color: #806030;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(50,35,10,0.95); color: #c89030; border-color: #6a4820; }
  .ctrl-btn.active { background: rgba(60,42,12,0.95); color: #f0c060; border-color: #9a6828; }

  /* Color picker wrapper */
  .color-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .color-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    background: rgba(30,22,8,0.9);
    border: 1px solid #3a2810;
    border-radius: 4px;
    color: #806030;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .color-btn:hover { background: rgba(50,35,10,0.95); color: #c89030; border-color: #6a4820; }

  .color-swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: var(--card-face);
    flex-shrink: 0;
  }

  /* Hidden real color input positioned over the button */
  .real-color-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    border: none;
    padding: 0;
  }

  /* Fullscreen mode overrides */
  body.fullscreen .controls { opacity: 0; pointer-events: none; transform: translateY(10px); }
</style>
</head>
<body>

<div id="snow-container"></div>

<div class="clock">
  <div class="digit-group">
    <div class="flip-card" id="h1"></div>
    <div class="flip-card" id="h2"></div>
  </div>
  <div class="colon">
    <div class="colon-dot"></div>
    <div class="colon-dot"></div>
  </div>
  <div class="digit-group">
    <div class="flip-card" id="m1"></div>
    <div class="flip-card" id="m2"></div>
  </div>
  <div class="colon sec-colon">
    <div class="colon-dot"></div>
    <div class="colon-dot"></div>
  </div>
  <div class="digit-group seconds">
    <div class="flip-card sm" id="s1"></div>
    <div class="flip-card sm" id="s2"></div>
  </div>
</div>

<div class="date-row" id="date-row">—</div>

<div class="weather" id="weather">
  <div class="weather-loading">HAETAAN SIJAINTIA...</div>
</div>

<!-- Controls (hidden in fullscreen) -->
<div class="controls" id="controls">

  <div class="loc-row">
    <input class="loc-input" id="loc-input" type="text" placeholder="Kaupunki..." spellcheck="false" autocomplete="off">
    <button class="ctrl-btn" id="loc-btn">HAE</button>
  </div>

  <div class="btn-row">
    <!-- Color picker -->
    <div class="color-wrap">
      <div class="color-btn">
        <div class="color-swatch" id="color-swatch"></div>
        VÄRI
      </div>
      <input class="real-color-input" type="color" id="color-input" value="#f0c060">
    </div>

    <!-- Snow toggle -->
    <button class="ctrl-btn" id="snow-btn">❄ LUMI</button>

    <!-- Fullscreen -->
    <button class="ctrl-btn" id="fs-btn">⛶ KOKO NÄYTTÖ</button>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
//  FLIP CARD
// ═══════════════════════════════════════════
function buildCard(el, digit) {
  el.innerHTML = `
    <div class="static-top"><div class="digit-face">${digit}</div></div>
    <div class="static-bottom"><div class="digit-face">${digit}</div></div>
    <div class="flap-top"><div class="digit-face">${digit}</div></div>
    <div class="flap-bottom"><div class="digit-face">${digit}</div></div>
  `;
  el.dataset.digit = digit;
}

function flipCard(el, newDigit) {
  const old = el.dataset.digit;
  if (old === newDigit) return;

  const flapTop    = el.querySelector('.flap-top');
  const flapBottom = el.querySelector('.flap-bottom');
  const staticTop  = el.querySelector('.static-top .digit-face');
  const staticBot  = el.querySelector('.static-bottom .digit-face');

  flapTop.querySelector('.digit-face').textContent    = old;
  flapBottom.querySelector('.digit-face').textContent = newDigit;
  staticTop.textContent = newDigit; // safe — covered by flap-top at 0°
  staticBot.textContent = old;      // keep old — exposed while flap-bottom is at 90° (invisible)

  flapTop.classList.remove('flip');
  flapBottom.classList.remove('flip');
  void flapTop.offsetWidth;
  void flapBottom.offsetWidth;
  flapTop.classList.add('flip');
  flapBottom.classList.add('flip');

  if (el._ft) clearTimeout(el._ft);
  el._ft = setTimeout(() => { staticBot.textContent = newDigit; }, 460);

  el.dataset.digit = newDigit;
}

const cards = {
  h1: document.getElementById('h1'), h2: document.getElementById('h2'),
  m1: document.getElementById('m1'), m2: document.getElementById('m2'),
  s1: document.getElementById('s1'), s2: document.getElementById('s2'),
};
Object.values(cards).forEach(el => buildCard(el, '0'));

// ═══════════════════════════════════════════
//  CLOCK TICK
// ═══════════════════════════════════════════
const FI_DAYS = ['Sunnuntai','Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai'];

function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  flipCard(cards.h1, hh[0]); flipCard(cards.h2, hh[1]);
  flipCard(cards.m1, mm[0]); flipCard(cards.m2, mm[1]);
  flipCard(cards.s1, ss[0]); flipCard(cards.s2, ss[1]);
  document.getElementById('date-row').textContent =
    `${FI_DAYS[now.getDay()]}  ${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`;
}
tick();
setInterval(tick, 1000);

// ═══════════════════════════════════════════
//  WEATHER
// ═══════════════════════════════════════════
const WMO = {
  0:['☀️','Selkeää'],    1:['🌤','Melko selkeää'],  2:['⛅','Puolipilvistä'],
  3:['☁️','Pilvistä'],   45:['🌫','Sumua'],          48:['🌫','Jäätävää sumua'],
  51:['🌦','Tihkua'],    53:['🌦','Tihkusadetta'],   55:['🌧','Rankka tihku'],
  61:['🌧','Vesisadetta'],63:['🌧','Koht. vesisade'], 65:['🌧','Rankka vesisade'],
  71:['🌨','Lumisadetta'],73:['🌨','Koht. lumisade'], 75:['❄️','Rankka lumisade'],
  77:['🌨','Lumirakeita'],80:['🌦','Kuurosadetta'],   81:['🌧','Koht. kuuro'],
  82:['⛈','Rankka kuuro'],85:['🌨','Lumikuuroja'],   86:['❄️','Rankkoja lumikuuroja'],
  95:['⛈','Ukkosmyrsky'],96:['⛈','Ukkonen+rakeet'], 99:['⛈','Rankka ukkonen'],
};

let weatherTimer = null;

async function fetchWeather(lat, lon, city) {
  const el = document.getElementById('weather');
  if (weatherTimer) clearTimeout(weatherTimer);
  try {
    if (!city) {
      try {
        const r = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
          { headers: { 'Accept-Language': 'fi' } }
        );
        const d = await r.json();
        city = d.address?.city || d.address?.town || d.address?.village || d.address?.municipality || '';
      } catch(_) {}
    }
    const res  = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=auto`
    );
    const data = await res.json();
    const cur  = data.current;
    const temp = Math.round(cur.temperature_2m);
    const wind = Math.round(cur.wind_speed_10m);
    const [icon, desc] = WMO[cur.weather_code] || ['🌡','Tuntematon'];
    el.innerHTML = `
      <div class="weather-icon">${icon}</div>
      <div class="weather-info">
        <div class="weather-temp">${temp > 0 ? '+' : ''}${temp}°C</div>
        <div class="weather-desc">${desc}</div>
        <div class="weather-city">${city ? city + '  ·  ' : ''}Tuuli ${wind} m/s</div>
      </div>`;
    weatherTimer = setTimeout(() => fetchWeather(lat, lon, city), 10 * 60 * 1000);
  } catch(_) {
    el.innerHTML = `<div class="weather-error">SÄÄTIETOJEN HAKU EPÄONNISTUI<br>TARKISTA YHTEYS</div>`;
  }
}

// Geocode city name → coordinates
async function geocodeCity(name) {
  const res  = await fetch(
    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`,
    { headers: { 'Accept-Language': 'fi' } }
  );
  const data = await res.json();
  if (!data.length) throw new Error('Kaupunkia ei löydy');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), city: data[0].display_name.split(',')[0] };
}

// IP geolocation with multiple fallbacks
async function getLocationByIP() {
  const services = [
    async () => {
      const d = await (await fetch('https://ip-api.com/json/?fields=lat,lon,city,status')).json();
      if (d.status !== 'success') throw new Error();
      return { lat: d.lat, lon: d.lon, city: d.city || '' };
    },
    async () => {
      const d = await (await fetch('https://ipapi.co/json/')).json();
      if (!d.latitude) throw new Error();
      return { lat: d.latitude, lon: d.longitude, city: d.city || '' };
    },
    async () => {
      const d = await (await fetch('https://freeipapi.com/api/json')).json();
      if (!d.latitude) throw new Error();
      return { lat: d.latitude, lon: d.longitude, city: d.cityName || '' };
    },
  ];
  for (const svc of services) {
    try { return await svc(); } catch(_) {}
  }
  throw new Error('IP-sijainti epäonnistui');
}

async function ipFallback() {
  const el = document.getElementById('weather');
  el.innerHTML = `<div class="weather-loading">HAETAAN IP-SIJAINNILLA...</div>`;
  try {
    const { lat, lon, city } = await getLocationByIP();
    fetchWeather(lat, lon, city);
  } catch(_) {
    el.innerHTML = `<div class="weather-error">SIJAINTIA EI SAATU<br>TARKISTA YHTEYS</div>`;
  }
}

function startWeather() {
  if (!navigator.geolocation) { ipFallback(); return; }
  const fallbackTimer = setTimeout(ipFallback, 4000);
  navigator.geolocation.getCurrentPosition(
    pos => {
      clearTimeout(fallbackTimer);
      fetchWeather(pos.coords.latitude, pos.coords.longitude, '');
    },
    () => { clearTimeout(fallbackTimer); ipFallback(); },
    { timeout: 8000, maximumAge: 300000 }
  );
}

startWeather();

// Manual location search
const locInput = document.getElementById('loc-input');
const locBtn   = document.getElementById('loc-btn');

async function searchLocation() {
  const name = locInput.value.trim();
  if (!name) return;
  const el = document.getElementById('weather');
  el.innerHTML = `<div class="weather-loading">HAETAAN...</div>`;
  try {
    const { lat, lon, city } = await geocodeCity(name);
    fetchWeather(lat, lon, city);
  } catch(_) {
    el.innerHTML = `<div class="weather-error">KAUPUNKIA EI LÖYDY<br>KOKEILE ENGLANNIKSI</div>`;
  }
}

locBtn.addEventListener('click', searchLocation);
locInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation(); });

// ═══════════════════════════════════════════
//  SNOW
// ═══════════════════════════════════════════
let snowActive = false;
const snowContainer = document.getElementById('snow-container');
const snowBtn       = document.getElementById('snow-btn');
let snowFlakes      = [];

function randomBetween(a, b) { return a + Math.random() * (b - a); }

function createSnowflake() {
  const el   = document.createElement('div');
  el.className = 'snowflake';
  const size = randomBetween(4, 13);
  const dur  = randomBetween(4, 11);
  const left = randomBetween(0, 100);
  const drift = randomBetween(-60, 60);
  const delay = randomBetween(0, dur);
  el.style.cssText = `
    width:${size}px; height:${size}px;
    left:${left}%;
    animation-duration:${dur}s;
    animation-delay:-${delay}s;
    --drift:${drift}px;
    opacity:${randomBetween(0.5, 0.9)};
  `;
  snowContainer.appendChild(el);
  return el;
}

function startSnow() {
  for (let i = 0; i < 60; i++) snowFlakes.push(createSnowflake());
}

function stopSnow() {
  snowFlakes.forEach(f => f.remove());
  snowFlakes = [];
}

snowBtn.addEventListener('click', () => {
  snowActive = !snowActive;
  if (snowActive) { startSnow(); snowBtn.classList.add('active'); }
  else            { stopSnow();  snowBtn.classList.remove('active'); }
});

// ═══════════════════════════════════════════
//  COLOR PICKER
// ═══════════════════════════════════════════
const colorInput  = document.getElementById('color-input');
const colorSwatch = document.getElementById('color-swatch');

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function adjustColor(hex, factor) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`;
}

function applyColor(hex) {
  const root = document.documentElement;
  root.style.setProperty('--card-face', hex);
  root.style.setProperty('--card-face-sec', adjustColor(hex, 0.75));
  root.style.setProperty('--accent', adjustColor(hex, 0.92));
  root.style.setProperty('--dim', adjustColor(hex, 0.5));
  colorSwatch.style.background = hex;
}

colorInput.addEventListener('input', e => applyColor(e.target.value));

// ═══════════════════════════════════════════
//  FULLSCREEN
// ═══════════════════════════════════════════
const fsBtn    = document.getElementById('fs-btn');
const controls = document.getElementById('controls');

function enterFullscreen() {
  document.documentElement.requestFullscreen?.() ||
  document.documentElement.webkitRequestFullscreen?.();
}
function exitFullscreen() {
  document.exitFullscreen?.() || document.webkitExitFullscreen?.();
}

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    enterFullscreen();
  } else {
    exitFullscreen();
  }
});

function onFullscreenChange() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  controls.classList.toggle('hidden', isFs);
  fsBtn.textContent = isFs ? '✕ POISTU' : '⛶ KOKO NÄYTTÖ';
}

document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
</script>
